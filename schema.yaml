  /api/v1/orders/{id}/pay/:
    post:
      operationId: v1_orders_pay_create
      description: Regista o pagamento de demonstração e altera o estado da encomenda
        para pago.
      summary: Pagar uma encomenda pendente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '409':
          description: A encomenda não pode ser paga no estado atual.
  /api/v1/payments/:
    get:
      operationId: v1_payments_list
      parameters:
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - failed
          - pending
          - refunded
        description: |-
          * `pending` - Pendente
          * `completed` - Concluído
          * `failed` - Falhado
          * `refunded` - Reembolsado
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
